<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="70" y="50" width="1060" height="600" rx="20" fill="url(#panel)" stroke="#374151"/>
  <text x="110" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f9fafb">C Programming Looper Project - Sample Output</text>

  <g font-family="Consolas, monospace" font-size="24" fill="#d1fae5">
    <text x="110" y="170">Q1 - Alphabet Skipper</text>
    <text x="110" y="210">a e i m q u y</text>

    <text x="110" y="290">Q2 - Digit Counter</text>
    <text x="110" y="330">Enter any number: 12345</text>
    <text x="110" y="360">Total number of digits: 5</text>

    <text x="110" y="450">Q3 - Digit Addition</text>
    <text x="110" y="490">Enter any number: 1234</text>
    <text x="110" y="520">The sum of the first and the last digit: 5</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#93c5fd">
    <text x="110" y="610">Output Screenshot</text>
  </g>
</svg>
